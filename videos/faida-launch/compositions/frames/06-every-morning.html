  <script>
    (function () {
      var DUR = 4.284;
      var tl = gsap.timeline({ paused: true });

      var phone = document.getElementById("f06-every-morning-phone");
      var win = document.getElementById("f06-every-morning-window");
      var scroller = document.getElementById("f06-every-morning-scroller");
      var bubble = document.getElementById("f06-every-morning-bubble");
      var markBar = document.getElementById("f06-every-morning-mark-bar");
      var eyebrow = document.getElementById("f06-every-morning-eyebrow");
      var timeEl = document.getElementById("f06-every-morning-time");
      var desc = document.getElementById("f06-every-morning-desc");
      var trace = document.getElementById("f06-every-morning-trace");

      /* ---- Scene 1 (0.0-0.8): the phone slides in from the left edge and settles ---- */
      tl.fromTo(phone, { x: -620 }, { x: 0, duration: 0.78, ease: "power3.out" }, 0);
      tl.fromTo(phone, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.22, ease: "power2.out" }, 0);

      /* the label fades up beside it */
      tl.fromTo(
        eyebrow,
        { y: 16, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.42, ease: "power3.out" },
        0.16
      );

      /* "07:00" hard-cuts in on the word "morning" - discrete text sequence */
      var SEQUENCE = [
        { t: 0.0, text: "" },
        { t: 0.46, text: "07:00" }
      ];
      function textAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            timeEl.textContent = textAt(driver.t);
          }
        },
        0
      );

      /* ---- Scene 2 (0.8-2.3): the card arrives as a message, then the screen scrolls ---- */
      tl.set(win, { autoAlpha: 0 }, 0);
      tl.fromTo(
        win,
        { scale: 0.75, autoAlpha: 0.6 },
        { scale: 1, autoAlpha: 1, duration: 0.32, ease: "power2.out", immediateRender: false },
        0.86
      );

      /* the card scrolls upward inside the clipped window: 175 of its 475px height */
      tl.fromTo(
        scroller,
        { y: 0 },
        { y: -175, duration: 0.86, ease: "power3.out", immediateRender: false },
        1.34
      );

      /* the description line lands as the brief's contents come into view */
      tl.fromTo(
        desc,
        { y: 20, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.5, ease: "power3.out" },
        1.52
      );

      /* ---- Scene 3 (2.3-3.6): the spike bubble pops in, the gold marker sweeps ---- */
      tl.set(bubble, { autoAlpha: 0 }, 0);
      tl.fromTo(
        bubble,
        { scale: 0, autoAlpha: 0 },
        { scale: 1, autoAlpha: 1, duration: 0.48, ease: "power3.out", immediateRender: false },
        2.34
      );
      tl.fromTo(
        markBar,
        { scaleX: 0, skewX: -2 },
        { scaleX: 1, skewX: -2, duration: 0.44, ease: "power2.out", immediateRender: false },
        2.86
      );

      /* the traceability card rises on "invoice" */
      tl.set(trace, { autoAlpha: 0 }, 0);
      tl.fromTo(
        trace,
        { y: 32, scale: 0.96, autoAlpha: 0 },
        { y: 0, scale: 1, autoAlpha: 1, duration: 0.58, ease: "power3.out", immediateRender: false },
        2.98
      );

      /* ---- Scene 4 (3.6-4.284): hold, one low-amplitude settle on the held phone ---- */
      var jitter = { p: 0 };
      tl.to(
        jitter,
        {
          p: Math.PI * 2,
          duration: 0.68,
          ease: "none",
          onUpdate: function () {
            gsap.set(phone, { y: Math.sin(jitter.p) * 2 });
          }
        },
        3.6
      );

      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines["06-every-morning"] = tl;
    })();
  </script>
