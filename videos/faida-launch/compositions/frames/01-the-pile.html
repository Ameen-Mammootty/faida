  <script>
    (function () {
      "use strict";

      var DURATION = 4.963;
      var INK = "#172421";
      var DEEP = "#153E35";

      var tl = gsap.timeline({ paused: true });

      var byId = function (id) { return document.getElementById(id); };

      /* ---- Scenes 1–2: the pile accumulates.
         The measured chat-message entry (scale 0.75, alpha 0.6 → 1, growing from the
         sender's corner) held on the smooth-settle register of spring-pop-entrance. */
      var ARRIVALS = [
        { el: "01-the-pile-b1", at: 0.10 },
        { el: "01-the-pile-b2", at: 0.76 },
        { el: "01-the-pile-b3", at: 1.13 },
        { el: "01-the-pile-b4", at: 1.50 },
        { el: "01-the-pile-b5", at: 1.87 }
      ];

      ARRIVALS.forEach(function (a) {
        tl.fromTo(
          byId(a.el),
          { scale: 0.75, opacity: 0.6, y: 18 },
          { scale: 1, opacity: 1, y: 0, duration: 0.30, ease: "power3.out" },
          a.at
        );
      });

      /* the density marker pops as the pile finishes building */
      tl.fromTo(
        byId("01-the-pile-chip"),
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        2.24
      );

      /* ---- Scene 3: the question types itself into the input bar.
         discrete-text-sequence states + a context-sensitive caret. */
      var SEQUENCE = [
        { t: 0.00, text: "", segment: "main", color: INK },
        { t: 3.00, text: "", segment: "main", color: INK },
        { t: 3.07, text: "s", segment: "main", color: INK },
        { t: 3.13, text: "so", segment: "main", color: INK },
        { t: 3.20, text: "so ", segment: "main", color: INK },
        { t: 3.28, text: "so w", segment: "main", color: INK },
        { t: 3.34, text: "so wh", segment: "main", color: INK },
        { t: 3.40, text: "so wha", segment: "main", color: INK },
        { t: 3.46, text: "so what", segment: "main", color: INK },
        { t: 3.55, text: "so what ", segment: "main", color: INK },
        { t: 3.62, text: "so what d", segment: "main", color: INK },
        { t: 3.68, text: "so what do", segment: "main", color: INK },
        { t: 3.74, text: "so what doe", segment: "main", color: INK },
        { t: 3.80, text: "so what does", segment: "main", color: INK },
        { t: 3.90, text: "so what does ", segment: "main", color: INK },
        { t: 3.97, text: "so what does a", segment: "main", color: INK },
        { t: 4.06, text: "so what does a ", segment: "main", color: INK },
        { t: 4.13, text: "so what does a k", segment: "dish", color: DEEP },
        { t: 4.19, text: "so what does a ka", segment: "dish", color: DEEP },
        { t: 4.25, text: "so what does a kar", segment: "dish", color: DEEP },
        { t: 4.31, text: "so what does a kara", segment: "dish", color: DEEP },
        { t: 4.37, text: "so what does a karal", segment: "dish", color: DEEP },
        { t: 4.46, text: "so what does a kara", segment: "dish", color: DEEP },
        { t: 4.52, text: "so what does a karak", segment: "dish", color: DEEP },
        { t: 4.59, text: "so what does a karak ", segment: "main", color: INK },
        { t: 4.66, text: "so what does a karak earn?", segment: "main", color: INK }
      ];

      /* baked once — every state whose text differs from its predecessor is a keystroke */
      var CHANGE_TIMES = SEQUENCE.filter(function (e, i) {
        return i > 0 && e.text !== SEQUENCE[i - 1].text;
      }).map(function (e) { return e.t; });

      var TYPING_GRACE = 0.16;
      var BLINK_CYCLES = 7; /* whole number over the fixed duration — period ≈ 0.71s */

      function entryAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i];
        }
        return SEQUENCE[0];
      }

      var textEl = byId("01-the-pile-type");
      var caretEl = byId("01-the-pile-caret");

      var driver = { t: 0, p: 0 };
      tl.to(
        driver,
        {
          t: DURATION,
          p: Math.PI * 2 * BLINK_CYCLES,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            var entry = entryAt(driver.t);
            textEl.textContent = entry.text;
            caretEl.style.background = entry.color;
            var typing = CHANGE_TIMES.some(function (t) {
              return t <= driver.t && driver.t - t < TYPING_GRACE;
            });
            caretEl.style.opacity = typing ? "1" : (Math.sin(driver.p) > 0 ? "1" : "0");
          }
        },
        0
      );

      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["01-the-pile"] = tl;
    })();
  </script>
