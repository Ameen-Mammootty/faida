    (function () {
      var A = "data-05-push-and-fix";
      var root = document.querySelector('[data-composition-id="05-push-and-fix"]');
      if (!root) return;
      var q = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };

      var label   = root.querySelector("[" + A + '="label"]');
      var rule    = root.querySelector("[" + A + '="rule"]');
      var chips   = root.querySelector("[" + A + '="chips"]');

      var quote   = root.querySelector("[" + A + '="quote"]');
      var qinner  = root.querySelector("[" + A + '="quoteinner"]');
      var rowEls  = q("[" + A + '="row"]');
      var fillEls = q("[" + A + '="fill"]');
      var pctEls  = q("[" + A + '="pct"]');
      var branchEls = q("[" + A + '="branch"]');
      var pushChips = q('[' + A + '="chip"][data-kind="push"]');
      var fixChips  = q('[' + A + '="chip"][data-kind="fix"]');

      var VALUES = [92.3, 82.9, 81.4, 64.2, 51.0, 38.1, -5.3];
      var SCALEX = [0.923, 0.829, 0.814, 0.642, 0.51, 0.381, 0.055];

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["05-push-and-fix"] = tl;

      /* ---- Scene 1 (0.0-0.6): the band and the empty card are there from the first frame ---- */

      tl.fromTo(list,  { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.40, ease: "power3.out" }, 0.04);

      /* ---- Scenes 2 + 3: the seven rows assemble in one staggered cascade ---- */
      var ROW_AT = [0.60, 0.72, 0.84, 1.95, 2.07, 2.19, 2.31];

      rowEls.forEach(function (row, i) {
        var at = ROW_AT[i];
        tl.fromTo(row,
          { opacity: 0, y: 20, scale: 0.985 },
          { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "power3.out" }, at);

        /* bar fills to its value, scaleX from the left */
        tl.fromTo(fillEls[i], { scaleX: 0 },
          { scaleX: SCALEX[i], duration: 0.62, ease: "power3.out" }, at + 0.16);

        /* the figure counts, growing in place on the same beat (no overshoot) */
        var el = pctEls[i];
        var target = VALUES[i];
        var state = { v: 0 };
        tl.to(state, {
          v: target, duration: 0.62, ease: "power3.out",
          onUpdate: function () { el.textContent = state.v.toFixed(1) + "%"; }
        }, at + 0.16);
        tl.fromTo(el, { scale: 0.62 }, { scale: 1, duration: 0.62, ease: "power3.out" }, at + 0.16);
      });

      /* "Push" chips land after the first three bars have settled */
      pushChips.forEach(function (c, i) {
        tl.fromTo(c, { opacity: 0, scale: 0.5 },
          { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out" }, 1.56 + i * 0.08);
      });

      /* "Fix" chips land on "loses" */
      fixChips.forEach(function (c, i) {
        tl.fromTo(c, { opacity: 0, scale: 0.5 },
          { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out" }, 2.86 + i * 0.09);
      });

      /* ---- Scene 4 (3.2-4.754): branch by branch ---- */
      /* the filled chip cycles in place, once, landing on Deira (discrete state replacement) */
      var CYCLE = [
        { t: 0.00, i: 0 },
        { t: 0.22, i: 1 },
        { t: 0.44, i: 2 }
      ];
      function branchAt(time) {
        for (var k = CYCLE.length - 1; k >= 0; k--) { if (time >= CYCLE[k].t) return CYCLE[k].i; }
        return 0;
      }
      var driver = { t: 0 };
      tl.to(driver, {
        t: 1.554, duration: 1.554, ease: "none",
