name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: faida_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/faida_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: apps/api
        run: pip install -e '.[dev]'
      - name: Lint
        working-directory: apps/api
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        working-directory: apps/api
        run: pytest -q
      - name: Eval scorer tests
        run: python -m pytest eval/tests -q
      - name: Eval smoke (recorded fixtures, no API key)
        run: python -m eval.run --smoke
