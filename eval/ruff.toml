# eval/ is outside apps/api, so it does not inherit that package's ruff
# config; without this file `ruff format` here reformats to the 88-column
# default and fights the repo's 100. Keep these in step with
# apps/api/pyproject.toml.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC"]
